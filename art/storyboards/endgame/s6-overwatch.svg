<text x="14.0" y="47.0" font-family="Noto Sans" font-size="14" font-weight="normal" text-anchor="start" fill="#5b4a6b">CAMERA: Over the kids' shoulders, low. Mom stands against the low sun: gold rim light. Kids turn on her first word.</text>
<text x="14.0" y="626.0" font-family="Noto Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#1b1430">MOM (the Admiral's voice, no radio at all now): Squadron. Time to go home.</text>
<text x="14.0" y="652.0" font-family="Noto Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#5b4a6b">LITTLE BROTHER: One more turn? Please?</text>
<text x="14.0" y="678.0" font-family="Noto Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#5b4a6b">MOM (a beat; the smile she never shows on the radio): …One more turn.</text>
<text x="946.0" y="692.0" font-family="Noto Sans" font-size="11" font-weight="normal" text-anchor="end" fill="#5b4a6b">white dashes = portrait-safe column (9:16)</text>
