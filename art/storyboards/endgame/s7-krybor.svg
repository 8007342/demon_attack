<text x="14.0" y="47.0" font-family="Noto Sans" font-size="14" font-weight="normal" text-anchor="start" fill="#5b4a6b">CAMERA: Crane up and back to a wide exterior. The neon sign flickers on as the sun touches the sea. Hold for the captions.</text>
