<text x="14.0" y="652.0" font-family="Noto Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#5b4a6b">SFX: the sign's neon hum is the carrier field hum. The metal theme returns as a ukulele for four bars.</text>
<text x="14.0" y="678.0" font-family="Noto Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#5b4a6b">Then the credits. The box lid on the table edge carries the edition for the difficulty just played.</text>
