<text x="14.0" y="47.0" font-family="Noto Sans" font-size="14" font-weight="normal" text-anchor="start" fill="#5b4a6b">CAMERA: Locked insert on the shelf by the register. Dusk-blue, one warm lamp. One tiny move, then black.</text>
<text x="14.0" y="626.0" font-family="Noto Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#1b1430">WAITRESS (off, to nobody): Same time next week, Marshal?</text>
<text x="14.0" y="652.0" font-family="Noto Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#5b4a6b">She stands a forgotten gargoyle with the others. For four frames its eyes catch the lamp. Cut to black.</text>
<text x="14.0" y="678.0" font-family="Noto Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#5b4a6b">Nothing explains it. The shelf holds one officer per campaign finished on this device (ledger row R7).</text>
<text x="946.0" y="692.0" font-family="Noto Sans" font-size="11" font-weight="normal" text-anchor="end" fill="#5b4a6b">white dashes = portrait-safe column (9:16)</text>
