<text x="14.0" y="47.0" font-family="Noto Sans" font-size="14" font-weight="normal" text-anchor="start" fill="#5b4a6b">CAMERA: Medium close through the pass window, framed by order tickets. Slow push-in. He never stops smiling.</text>
<text x="14.0" y="626.0" font-family="Noto Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#1b1430">OWNER (beaming, spatula salute, hits the bell): Order up, table five! Smile, everybody. It's a beautiful day!</text>
<text x="14.0" y="652.0" font-family="Noto Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#5b4a6b">SFX: bell = the weapon-pickup chime, same pitch. Grill flare = the Ember Moon forge roar, one octave up.</text>
<text x="14.0" y="678.0" font-family="Noto Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#5b4a6b">His cap wears the teal chevron. Behind him: the HALL OF FAME chalkboard and an old arcade cabinet. The ticket is your score.</text>
<text x="946.0" y="692.0" font-family="Noto Sans" font-size="11" font-weight="normal" text-anchor="end" fill="#5b4a6b">white dashes = portrait-safe column (9:16)</text>
