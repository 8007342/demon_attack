<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100e2c">
<title>Demon Attack · Scan to play</title>
<meta name="description" content="Demon Attack: an original battle-metal arcade shooter. Scan to play in your browser.">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="preload" as="image" href="/qr/poster-portrait.jpg" media="(orientation: portrait)">
<link rel="preload" as="image" href="/qr/poster-landscape.jpg" media="(orientation: landscape)">
<style>
  /* Palette: lib/game/scene.dart (ink, mint, violet, gold) and the emblem's midnight and rim. */
  :root {
    --midnight: #100e2c;
    --ink: #080d18;
    --mint: #70f5d5;
    --cyan: #39dfcc;
    --violet: #bda7ff;
    --gold: #f4ca79;
    --rim: #efbd57;
    --ember: #ff6b1a;
    --text: #e8f1ff;
    --muted: #9aa6c4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--midnight); color: var(--text); }
  body {
    font-family: "Roboto", "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- the poster, full bleed, art per orientation ---- */
  .poster {
    position: fixed; inset: 0;
    background: var(--ink) url("/qr/poster-portrait.jpg") center 30% / cover no-repeat;
    animation: breathe 18s ease-in-out infinite alternate;
  }
  @media (orientation: landscape) {
    .poster { background-image: url("/qr/poster-landscape.jpg"); background-position: 35% 40%; }
  }
  @keyframes breathe { from { transform: scale(1.02); } to { transform: scale(1.07); } }

  /* Shade for legibility: top band for the title, bottom (or right) band for the code. */
  .shade {
    position: fixed; inset: 0; pointer-events: none;
    background:
      linear-gradient(180deg, rgba(8,13,24,.82) 0%, rgba(8,13,24,0) 26%),
      linear-gradient(0deg, rgba(8,13,24,.94) 0%, rgba(8,13,24,.55) 34%, rgba(8,13,24,0) 58%);
  }
  @media (orientation: landscape) {
    .shade {
      background:
        linear-gradient(270deg, rgba(8,13,24,.94) 0%, rgba(8,13,24,.6) 36%, rgba(8,13,24,0) 62%),
        linear-gradient(0deg, rgba(8,13,24,.6) 0%, rgba(8,13,24,0) 30%);
    }
  }

  /* ---- drifting fog: two thin sheets, as in the game ---- */
  .fog {
    position: fixed; left: -50%; width: 200%; pointer-events: none;
    background:
      radial-gradient(ellipse 22% 40% at 18% 50%, rgba(140,128,190,.22), transparent 70%),
      radial-gradient(ellipse 28% 46% at 47% 60%, rgba(107,112,150,.20), transparent 72%),
      radial-gradient(ellipse 20% 36% at 74% 42%, rgba(160,140,210,.18), transparent 70%),
      radial-gradient(ellipse 26% 44% at 96% 56%, rgba(107,112,150,.20), transparent 72%);
    filter: blur(6px);
  }
  .fog.low { bottom: -8%; height: 46%; animation: drift 46s linear infinite; }
  .fog.high { top: 8%; height: 36%; opacity: .55; animation: drift 70s linear infinite reverse; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(25%); } }

  /* ---- layout ---- */
  main {
    position: relative; z-index: 1;
    min-height: 100%; height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    justify-items: center;
    padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right))
             max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    text-align: center;
  }
  @media (orientation: landscape) {
    main {
      grid-template-rows: 1fr;
      grid-template-columns: 1fr minmax(300px, 44vw);
      align-items: center;
      justify-items: stretch;
    }
    .masthead { grid-column: 2; grid-row: 1; align-self: start; }
    .card { grid-column: 2; grid-row: 1; align-self: end; justify-self: center; }
    .spacer { display: none; }
  }

  .kicker {
    margin: 0; font-size: clamp(10px, 1.6vmin, 13px); letter-spacing: .32em;
    color: var(--muted); text-transform: uppercase;
  }
  h1 {
    margin: .15em 0 0; line-height: .95;
    font-size: clamp(38px, 11vmin, 104px); font-weight: 800; letter-spacing: .12em;
    color: var(--mint);
    text-shadow: 0 0 18px rgba(57,223,204,.55), 0 0 2px #0a0716, 0 3px 0 #0a0716;
  }
  h1 span { color: var(--gold); text-shadow: 0 0 18px rgba(255,107,26,.55), 0 0 2px #0a0716, 0 3px 0 #0a0716; }
  .tagline {
    margin: .7em 0 0; font-size: clamp(11px, 1.9vmin, 15px); letter-spacing: .22em;
    color: var(--violet); text-transform: uppercase;
  }

  /* ---- the code card ---- */
  .card {
    --size: min(62vmin, 340px);
    display: grid; justify-items: center; gap: 12px;
    padding: 16px 16px 14px;
    background: linear-gradient(180deg, rgba(18,29,46,.88), rgba(10,18,32,.92));
    border: 1px solid rgba(239,189,87,.75);
    border-radius: 14px;
    box-shadow: 0 0 0 1px rgba(10,7,22,.9), 0 0 28px rgba(57,223,204,.28), 0 16px 40px rgba(0,0,0,.6);
    backdrop-filter: blur(3px);
  }
  @media (orientation: landscape) { .card { --size: min(52vh, 330px); } }
  .scan {
    margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .3em; color: var(--gold);
  }
  .qr {
    width: var(--size); height: var(--size);
    border-radius: 10px;
    box-shadow: 0 0 0 3px #0a0716, 0 0 0 5px rgba(112,245,213,.55), 0 0 26px rgba(112,245,213,.35);
  }
  .qr svg { display: block; width: 100%; height: 100%; }
  .play {
    display: inline-block; margin-top: 2px;
    padding: 11px 22px; border-radius: 8px;
    background: var(--mint); color: #0a0716; text-decoration: none;
    font-weight: 800; font-size: 14px; letter-spacing: .2em;
    box-shadow: 0 0 18px rgba(112,245,213,.45);
  }
  .play:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .url { margin: 0; font-size: 12px; letter-spacing: .08em; color: var(--muted); }

  /* Short landscape (phones on their side): tighten. */
  @media (orientation: landscape) and (max-height: 480px) {
    /* Title moves over the poster (left); the right column is the code alone. */
    .masthead { grid-column: 1; justify-self: start; text-align: left; }
    h1 { font-size: clamp(30px, 11vh, 56px); }
    .tagline { display: none; }
    .card { align-self: center; padding: 10px 12px; gap: 7px; --size: min(56vh, 240px); }
    .scan { font-size: 10px; }
    .play { padding: 7px 16px; font-size: 12px; }
    .url { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .poster, .fog { animation: none; }
  }
</style>
</head>
